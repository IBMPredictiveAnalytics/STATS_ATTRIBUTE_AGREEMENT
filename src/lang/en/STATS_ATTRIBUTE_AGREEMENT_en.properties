# Language properties for STATS_ATTRIBUTE_AGREEMENT
# NLS_MESSAGEFORMAT_NONE.
# NLS_ENCODING=UNICODE.

STATS_ATTRIBUTE_AGREEMENT.IMAGE=defaultExtensionDialog.png
STATS_ATTRIBUTE_AGREEMENT.LABEL=Attribute Agreement Analysis
STATS_ATTRIBUTE_AGREEMENT.TITLE=Attribute Agreement Analysis
STATS_ATTRIBUTE_AGREEMENT_proc_title.TITLE=Attribute Agreement Analysis
appraisernames.LABEL=Appraiser names (comma-separated):
appraisernames.TOOLTIP=Optional. Comma-separated display names for each appraiser, e.g. Alice,Bob,Carol. If omitted, appraisers are labeled Appraiser1, Appraiser2, ...
categories.LABEL=Category order (comma-separated):
categories.TOOLTIP=Optional explicit list of response categories in display/rank order, e.g. Pass,Fail or Low,Medium,High. If omitted, categories are derived from the data.
ch_catpie.LABEL=Category distribution pie chart
ch_confusionplot.LABEL=Confusion matrix plot
ch_disagreenetwork.LABEL=Appraiser disagreement network
ch_heatmap.LABEL=Between-appraiser agreement heatmap
ch_kappaforest.LABEL=Kappa forest plot
ch_metricspanel.LABEL=Key metrics panel
ch_vsstdbar.LABEL=Each appraiser vs. Standard bar chart
ch_withinbar.LABEL=Within-appraiser consistency bar chart
charts.dialogTitleKey=Charts
charts_group=Charts
charts_subdialog.buttonResKey.LABEL=Charts...
gen_appraisers.LABEL=Number of appraisers:
gen_appraisers.TOOLTIP=Number of appraisers to include in the generated worksheet
gen_cats.LABEL=Categories (comma-separated):
gen_cats.TOOLTIP=Response categories to note on the generated worksheet, e.g. Pass,Fail
gen_createvars.LABEL=Write worksheet into a new active dataset
gen_createvars.TOOLTIP=Experimental: in addition to the worksheet table, attempt to write the worksheet into a new active dataset (not yet verified)
gen_includestd.LABEL=Include Standard column
gen_includestd.TOOLTIP=Add a Standard/reference column to the generated worksheet
gen_samples.LABEL=Number of samples:
gen_samples.TOOLTIP=Number of samples/parts to include in the generated worksheet
gen_trials.LABEL=Trials per appraiser:
gen_trials.TOOLTIP=Number of repeat rating trials per appraiser in the generated worksheet
gendata.LABEL=Generate a blank rating worksheet
gendata.TOOLTIP=Produce an empty rating worksheet instead of analyzing existing data
generate_group=Worksheet Designer
ntrials.LABEL=Trials per appraiser:
ntrials.TOOLTIP=Number of repeated trial columns contributed by each appraiser (every appraiser must contribute the same number)
opt_between.LABEL=Between-appraiser agreement
opt_confusion.LABEL=Confusion matrices (vs. Standard)
opt_effectiveness.LABEL=Effectiveness / Miss Rate / False Alarm Rate (vs. Standard)
opt_effectiveness.TOOLTIP=One-vs-rest classification metrics (AIAG MSA-4 terminology) for each category, pooling every appraiser's primary-trial reading against Standard
opt_fleiss.LABEL=Fleiss' kappa (all appraisers, overall + by category)
opt_fleiss.TOOLTIP=Multi-rater kappa (Fleiss, 1971) treating every appraiser x trial reading as one rater; includes a significance test (Fleiss, Nee & Landis, 1979) for the overall statistic
opt_kappa.LABEL=Kappa statistics (appraiser pairs)
opt_kendall.LABEL=Kendall's W coefficient of concordance
opt_pabak.LABEL=PABAK (prevalence-adjusted bias-adjusted kappa)
opt_pabak.TOOLTIP=Supplementary statistic that adjusts kappa for the effect of category prevalence/bias; computed from the same agreement proportion used by Fleiss' kappa
opt_vsstandard.LABEL=Each appraiser vs. Standard
opt_within.LABEL=Within-appraiser agreement
options.dialogTitleKey=Options
options_group=Statistics to Compute
options_subdialog.buttonResKey.LABEL=Options...
out_disagree.LABEL=Disagreement source listing
out_interpretation.LABEL=Show Interpretation column in tables
out_interpretation.TOOLTIP=When off, drops the qualitative "Interpretation" column (e.g. Excellent/Fair-Good/Poor) from the Kappa, Fleiss' Kappa, and Kendall's W tables, leaving only the numeric statistics
out_maxlist.LABEL=Max disagreements to list:
out_maxlist.TOOLTIP=Maximum number of individual disagreement rows shown in the detail table
out_rrsummary.LABEL=Repeatability & Reproducibility summary (AIAG terminology)
out_rrsummary.TOOLTIP=Relabels the Within-/Between-Appraiser Agreement averages above using standard AIAG MSA-4 Repeatability/Reproducibility terminology; no new computation
out_summary.LABEL=Summary table
output.dialogTitleKey=Output
output_group=Output Tables
output_subdialog.buttonResKey.LABEL=Output...
sampleid.LABEL=Sample ID:
sampleid.TOOLTIP=Optional variable identifying each sample/part being rated
source.LABEL=Variables:
standard.LABEL=Standard / Reference:
standard.TOOLTIP=Optional known-correct reference rating used for vs.-Standard agreement and confusion matrices
study_by.LABEL=Conducted by:
study_by.TOOLTIP=Optional label identifying who conducted the study
study_date.LABEL=Date:
study_date.TOOLTIP=Optional free-text date label for the study
study_name.LABEL=Study name:
studyinfo.dialogTitleKey=Study Information
studyinfo_group=Study Information
studyinfo_subdialog.buttonResKey.LABEL=Study Info...
vars.LABEL=Rater/Trial Variables:
vars.TOOLTIP=Select the rating columns in appraiser-major order: all of Appraiser 1's trials, then all of Appraiser 2's trials, and so on
